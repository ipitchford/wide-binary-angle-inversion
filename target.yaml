target_id: wide-binary-angle-identifiability
search_date: 2026-10-28
intended_contribution_unit: exact-projected-likelihood-and-constructive-injectivity-theorem
claim:
  exact_statement: |
    Let F and G be Borel probability laws of eccentricity e on [0,1).
    Independently conditionally on e, sample mean anomaly uniformly on [0,2*pi)
    and orient the Kepler orbit by Haar measure on SO(3). Let gamma in [0,pi]
    be the angle between the sky-plane projections of relative position and
    relative velocity at that epoch. The proposed target is to prove that
    equality of the probability laws of gamma implies F=G, via an exact
    elementary projected likelihood and its reduction to a classical Abel
    transform. Atoms are included. Selection, unknown anisotropic orientations,
    orbital-phase selection and measurement error are excluded initially.
  exclusions:
    - Distinguishing only a one-parameter power-law family does not suffice.
    - Numerical full rank of discretised kernels does not prove injectivity.
    - A formula for the forward kernel alone does not resolve the question.
    - No claim that all ingredients of an eventual proof are historically new.
    - No point identification of an individual binary's eccentricity from one angle, and no claim of real-catalogue precision or empirical performance.
source:
  originating_reference: Hwang, Ting and Zakamska (2022), The eccentricity distribution of wide binaries and their individual measurements, MNRAS 512, 3383-3399, Appendix B.
  url: https://doi.org/10.1093/mnras/stac675
  arxiv: https://arxiv.org/abs/2111.01789
normalisation:
  indices: Continuous eccentricity law; no finite matrix is the primary object.
  scaling: Dimensionless angle only; mass and semi-major axis cancel.
  basis_order: Primary bridge uses c=abs(cos(gamma)) and eccentricity e; older spectral fingerprints retained below as audit history.
  symmetries:
    - gamma -> pi-gamma under time reversal
    - arbitrary common SO(3) rotation of position and velocity
