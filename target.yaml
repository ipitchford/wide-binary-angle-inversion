known_invariants:
  e_zero: 'Intrinsic position-velocity angle equals pi/2; projected angle density is -log(abs(cos(gamma)))/(pi*sin(gamma)^2).'
  thermal: f(e)=2e gives a uniform projected angle density 1/pi (known, not claimed new).
  e_one_limit: In the radial limit, projected angles concentrate at 0 and pi.
  finite_fingerprint_requirement: Intrinsically continuous target. Exact primary kernel, limiting cases, power-law family, and prior spectral fingerprints are recorded.
  projected_kernel_integral: 'p(gamma|e)=1/(pi*sin(gamma)^2)*integral_{max(e,abs(cos(gamma)))}^1 dt/sqrt(t^2-e^2), 0<e<1.'
  projected_kernel_acosh: 'p(gamma|e)=(acosh(1/e)-1_{abs(cos(gamma))>e}*acosh(abs(cos(gamma))/e))/(pi*sin(gamma)^2).'
  projected_kernel_atanh: 'Set j=sqrt(1-e^2), s=sin(gamma): p=(atanh(j)-1_{s<j}*atanh(sqrt((j^2-s^2)/(1-s^2))))/(pi*s^2).'
  cot_uniform_mixture: 'Given beta uniform[0,2*pi), cot(gamma) is uniform[-A_beta,A_beta], A_beta=sqrt(1/((1-e^2)*sin(beta)^2)-1).'
  abel_bridge_density: 'If F has density f, -d/dc[pi*(1-c^2)*p(arccos(c))]=integral_0^c f(e)/sqrt(c^2-e^2) de, 0<c<1; arbitrary measures use a.e./distributional interpretation.'
  powerlaw_angle: 'For f(e)=(alpha+1)*e^alpha, alpha>-1: p(gamma)=B((alpha+1)/2,1/2)/(2*pi)*(1-abs(cos(gamma))^(alpha+1))/sin(gamma)^2.'
  uniform_eccentricity_angle: 'f(e)=1 yields p(gamma)=1/(2*(1+abs(cos(gamma)))).'
  odd_sine_moments: 'pi*E[sin(gamma)^(2*k+1)|e]=B(k,1/2)*sum_{r=0}^{k-1} (1-e^2)^(r+1/2)/(2*r+1), k>=1.'
  bounded_unbiased_observable: 'W_k(gamma)=pi/B(k,1/2)*sin(gamma)^(2*k-1)*(1-(2*k-1)*cos(gamma)^2); E[W_k|e]=(1-e^2)^(k-1/2).'
  intrinsic_kernel: 'p(mu|e)=sqrt(1-e^2)/(pi*(1-mu^2)*sqrt(e^2-mu^2)), |mu|<e; e=0 gives delta_0. Same kernel as Hwang et al. equations 11-16 after simplification.'
  dual_moment_one: 'E[P_2(mu)]=1-(3*pi/4)*E[sin(gamma)^3]'
  dual_moment_two: 'E[P_4(mu)]=1-(75*pi/16)*E[sin(gamma)^3]+(315*pi/64)*E[sin(gamma)^5]'
  dual_moment_three: 'E[P_6(mu)]=1-(3675*pi/256)*E[sin(gamma)^3]+(19845*pi/512)*E[sin(gamma)^5]-(51975*pi/2048)*E[sin(gamma)^7]'
  eccentricity_moment_one: 'E[sqrt(1-e^2)]=(pi/2)*E[sin(gamma)^3]'
  weighted_moments: 'E[(1-mu^2)*mu^(2*n)]=binomial(2*n,n)/4^n*E[sqrt(1-e^2)*e^(2*n)]'
