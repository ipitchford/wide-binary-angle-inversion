# SPDX-License-Identifier: MIT
name: Full replay
on:
  workflow_dispatch:
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned packages
        run: pip install -r requirements.txt
      - name: Full suite, 400,000 binaries per eccentricity (python -O)
        run: cd "$RUNNER_TEMP" && python -B -O -c "import runpy,sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); sys.argv=['validate_and_plot.py','--n-per-e','400000','--out','$RUNNER_TEMP/full']; runpy.run_path('$GITHUB_WORKSPACE/validate_and_plot.py', run_name='__main__')"
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
