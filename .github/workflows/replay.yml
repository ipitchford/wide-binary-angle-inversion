# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install pinned packages
        run: pip install -r requirements.txt
      - name: Quick checks (python -O)
        run: python -I -B -O quick_checks.py --out "$RUNNER_TEMP/quick"
      - name: Semantic negative controls (python -O)
        run: python -I -B -O negative_controls.py --out "$RUNNER_TEMP/nc"
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
